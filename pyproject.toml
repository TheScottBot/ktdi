[project]
name = "ktdi"
version = "0.1.0"
description = "Keep The Degenerates Inline - a Discord bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.3",
    "aiohttp>=3.9",
    "tzdata",  # Timezone data for reminders (Windows has none built in; harmless on Linux).
    "python-dotenv>=1.0",
]

[project.scripts]
ktdi = "bot:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["bot", "abm", "library", "reminders"]
