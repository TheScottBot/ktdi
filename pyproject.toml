[project]
name = "ktdi"
version = "0.1.0"
description = "Keep The Degenerates Inline - a Discord bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.6",  # 2.6 added the form fields (Label) used by right-click > Save quote.
    "aiohttp>=3.9",
    "tzdata",  # Timezone data for reminders (Windows has none built in; harmless on Linux).
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ktdi = "ktdi.bot:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ktdi*"]

[tool.setuptools.package-data]
"ktdi.lib" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# discord.py's own deprecation warnings on newer Pythons; nothing to do with this code.
filterwarnings = ["ignore::DeprecationWarning:discord.*"]
